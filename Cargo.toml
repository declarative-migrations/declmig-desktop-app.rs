    [package]
    name = "declmig-desktop-app"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "Native Rust desktop app for Declarative Migrations"
    repository = "https://github.com/declarative-migrations/declmig-desktop-app.rs"
    default-run = "declmig-desktop"

    [lib]
    name = "declmig_desktop_core"
    path = "src/lib.rs"

    [[bin]]
    name = "declmig-desktop"
    path = "src/main.rs"

    [dependencies]
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "cf8f87506afafb56517563530c40dad1df1aedb6" }
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"

[lints.rust]
unsafe_code = "forbid"


